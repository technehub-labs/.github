# TechNeHub Labs Portfolio Registry
# Established by CR-TNH-README-03 (implements CR-TNH-README-01).
#
# Authority boundary: GitHub is authoritative for repository EXISTENCE.
# This registry is authoritative for portfolio CLASSIFICATION and PRESENTATION
# metadata (family, lifecycle, role, canonical status, relationships, featured).
#
# Maintenance: edit records here; run scripts/validate_registry.py to check;
# run scripts/generate_portfolio.py to regenerate portfolio pages. Nightly CI
# (portfolio-check.yml) validates against the live organisation.

version: 1
organization: technehub-labs

# Vocabularies (CR-TNH-README-02)
families: [foundation, concepts, catalogs, assessment, tooling, applications, governance, archive]
lifecycle: [proposed, experimental, active, stable, deprecated, archived]
canonical_values: [canonical, supporting, reference, experimental, historical]


# Family presentation metadata (CR-TNH-README-02 purposes; CR-TNH-README-04 pages)
family_details:
  foundation:
    title: Foundation
    purpose: "Authoritative architectural, conceptual, semantic and metamodel foundations."
    page: portfolio/foundation.md
  concepts:
    title: Concepts
    purpose: "Conceptual and exploratory models representing domains, patterns and emerging areas."
    page: portfolio/concepts.md
  catalogs:
    title: Reference Catalogs
    purpose: "Governed reference catalogs instantiated from and aligned with the canonical model."
    page: portfolio/catalogs.md
  assessment:
    title: Assessment
    purpose: "Assessment models, assessment mechanisms, measurement and evidence assets."
    page: portfolio/assessment.md
  tooling:
    title: Tooling
    purpose: "Software supporting modeling, validation, generation, transformation, visualization and consumption."
    page: portfolio/tooling.md
  applications:
    title: Applications
    purpose: "Demonstrations and practical realizations of the architecture."
    page: portfolio/applications.md
  governance:
    title: Governance
    purpose: "Governance, lifecycle, contribution, standards and organizational assets."
    page: portfolio/governance.md
  archive:
    title: Archive
    purpose: "Superseded, deprecated or retired repositories retained for historical purposes."
    page: portfolio/archive.md

repositories:
  - name: dea-architecture-framework
    family: foundation
    status: active
    role: Architecture Framework
    canonical: canonical
    visibility: public
    featured: true
    description: "OpenDEAM — Open Digital Enterprise Architecture Model. Root authority for DEA architecture layers, building blocks, entity allocation, and relationships."

  - name: dea-concepts-model
    family: foundation
    status: active
    role: Concepts Model
    canonical: canonical
    visibility: public
    featured: true
    description: OpenDEA Concepts Model — canonical conceptual layer between the DEA Metaframework (ECF) and the DEA Metamodel (CR-CM-001)
    depends_on: [dea-metaframework]

  - name: dea-metaframework
    family: foundation
    status: active
    role: Metaframework
    canonical: canonical
    visibility: public
    featured: true
    description: "Enterprise Concept Framework, the 7×7 axiom-derived matrix that the DEA metamodel and catalogs instantiate."
    depends_on: [dea-architecture-framework]

  - name: dea-metamodel
    family: foundation
    status: stable
    role: Metamodel
    canonical: canonical
    visibility: public
    featured: true
    description: "Digital Enterprise Architecture Metamodel: canonical entity definitions, relationships, and schemas for all DEA catalog repositories."
    depends_on: [dea-concepts-model]

  - name: dea-ontology
