    description: "Enterprise Ontology — canonical grounding repository for formal OWL/RDF ontology practice (upper-ontology conventions, ontology-engineering patterns, ontology lifecycle) and the means to author sector-, industry-, and sub-sector-specific Enterprise Ontologies (e.g. Enterprise Business Ontology, Enterprise Technology Ontology). (CR-EO-01)"
    depends_on: [dea-metamodel]

  - name: dea-semantic-architecture
