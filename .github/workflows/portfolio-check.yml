name: portfolio-check

# Validates the portfolio registry (registry/repositories.yaml) against the
# live organization and verifies that generated portfolio regions are current.
# Opens/updates/closes a tracking issue (label: portfolio-drift) on drift.
# Supersedes repo-drift-check.yml (CR-TNH-README-07): the README repository
# table it checked was retired by CR-TNH-README-06.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:
  push:
    paths:
      - "registry/**"
      - "portfolio/**"
      - "scripts/**"
      - ".github/workflows/portfolio-check.yml"
  pull_request:
    paths:
      - "registry/**"
      - "portfolio/**"
      - "scripts/**"

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate registry against live organization
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ORG_REPOS_TOKEN: PAT with org-wide read so private repos are
          # visible to the check. Falls back to GITHUB_TOKEN (public repos
          # only), which reports private registry records as broken links;
          # set ORG_REPOS_TOKEN for full checks.
          ORG_REPOS_TOKEN: ${{ secrets.ORG_REPOS_TOKEN }}
        run: python3 scripts/validate_registry.py

      - name: Verify generated portfolio regions are current
        run: python3 scripts/generate_portfolio.py --check
